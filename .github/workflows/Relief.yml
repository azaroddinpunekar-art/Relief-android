
name: Build RELIEF Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RELIEF project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip "RELIEF-Android-Project (1).zip" -d extracted
          cd extracted/RELIEF-Android
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build RELIEF APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RELIEF-debug-apk
          path: extracted/RELIEF-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
